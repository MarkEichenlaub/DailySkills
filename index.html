<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Skill Practice</title>
    <link rel="stylesheet" href="css/app.css">

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
</head>
<body>
    <header>
        <h1>Daily Skill Practice</h1>
        <div class="auth-bar" id="authBar">
            <span class="sync-status" id="syncStatus"></span>
            <button id="signInBtn" onclick="app.signIn()" style="display:none;">Sign in with Google</button>
            <span class="user-name" id="userName" style="display:none;"></span>
            <button id="signOutBtn" onclick="app.signOut()" style="display:none;">Sign out</button>
        </div>
    </header>

    <div class="container">
        <!-- Home Screen -->
        <div id="homeScreen" class="screen active">
            <div class="card">
                <h2>Today's Progress</h2>
                <div class="stats">
                    <div class="stat-box">
                        <div class="stat-value" id="todayTime">0</div>
                        <div class="stat-label">Minutes Today</div>
                    </div>
                    <div class="stat-box">
                        <div class="stat-value" id="streak">0</div>
                        <div class="stat-label">Day Streak</div>
                    </div>
                    <div class="stat-box">
                        <div class="stat-value" id="totalTrials">0</div>
                        <div class="stat-label">Total Trials</div>
                    </div>
                </div>
                <button onclick="app.startPractice()" style="width: 100%; margin-top: 1rem; padding: 1rem; font-size: 1.1rem;">
                    Start Practice
                </button>
            </div>

            <div class="card">
                <h2>Skills</h2>
                <p style="color:#7f8c8d; font-size:0.85rem; margin:-0.25rem 0 0.5rem;">Click a skill to practice just that one, or use "Start Practice" above to let it pick for you.</p>
                <div id="skillList" class="skill-list"></div>
            </div>

            <div class="card">
                <h2>Settings</h2>
                <div>
                    <button onclick="app.resetAllData()" class="secondary">Reset All Data</button>
                </div>
            </div>
        </div>

        <!-- Practice Screen -->
        <div id="practiceScreen" class="screen">
            <div class="card">
                <div class="timer-section">
                    <div>
                        <strong id="currentSkillName">Skill</strong>
                        <span class="trial-type" id="trialType"></span>
                    </div>
                    <div class="timer" id="practiceTimer">5:00</div>
                </div>

                <div class="practice-layout">
                    <div class="practice-main">
                        <div class="practice-area">
                            <div class="question" id="questionText"></div>
                            <div id="inputArea"></div>
                            <div class="feedback" id="feedback"></div>
                            <button id="continueButton" class="hidden" onclick="app.nextTrial()">
                                Continue (Enter)
                            </button>
                        </div>

                        <div class="menu">
                            <button onclick="app.pausePractice()" class="secondary">Pause</button>
                            <button onclick="app.endPractice()" class="secondary">End Practice</button>
                        </div>
                    </div>

                    <div class="session-stats">
                        <h3>Session Stats</h3>
                        <div style="margin: 0.5rem 0;">
                            <strong>Trials:</strong> <span id="sessionTrials">0</span>
                        </div>
                        <div style="margin: 0.5rem 0;">
                            <strong>Correct:</strong> <span id="sessionCorrect">0</span>
                        </div>
                        <div style="margin: 0.5rem 0;">
                            <strong>Accuracy:</strong> <span id="sessionAccuracy">-</span>
                        </div>
                        <div style="margin: 0.5rem 0;">
                            <strong>Avg Score:</strong> <span id="sessionAvgScore">-</span>
                        </div>
                        <div style="margin: 0.5rem 0;">
                            <strong>Avg Time:</strong> <span id="sessionAvgTime">-</span>
                        </div>
                        <div style="margin: 0.5rem 0;">
                            <strong>Best Ever:</strong> <span id="skillBestTime">-</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script type="module" src="js/main.js"></script>
</body>
</html>
